name: Candidate Price Review (NO orders)

on:
  schedule:
    # Mon-Fri 20:53 UTC = 21:53 CET / 22:53 CEST. GitHub may delay/skip runs.
    - cron: "53 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha-candidate-price-review
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Check synced EUR closing prices (review levels only)
        run: python scripts/watchlist_price_review.py

      - name: Archive research artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-review-${{ github.run_id }}
          path: reports/watchlist/
          retention-days: 30
          if-no-files-found: error

      - name: Commit dated price review (NOT an order)
        run: |
          git config user.name "project-alpha-review[bot]"
          git config user.email "project-alpha-review[bot]@users.noreply.github.com"
          git add -- reports/watchlist/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "report: candidate prices checked; review-only thresholds"
            git push origin HEAD:main
          fi
