
name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} — Unit Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose portfolio fixture
        run: |
          echo "=== Repository root ==="
          pwd
          echo "=== Root files ==="
          ls -la
          echo "=== Data directory ==="
          if [ -d data ]; then
            ls -la data
          else
            echo "data directory is missing"
          fi
          echo "=== Search fixture ==="
          find . -type f -name "portfolio_v1.csv" -print
          echo "=== Required path ==="
          if [ -f data/portfolio_v1.csv ]; then
            echo "PASS: portfolio fixture found"
          else
            echo "FAIL: portfolio fixture missing"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q

